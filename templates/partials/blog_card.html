<article class="blog-card">
  <div class="blog-image">
    {% if post.cover_image %}
      <img src="{{ post.cover_image.url }}" alt="{{ post.title }}" loading="lazy"  width="100%" height="190"style="object-fit: cover;"/>
    {% else %}
      <div class="blog-icon" aria-hidden="true">
        <i class="fa-regular fa-newspaper"></i>
      </div>
    {% endif %}
  </div>

  <div class="blog-body">
    <div class="blog-meta">
      <i class="fa-regular fa-calendar"></i>
      <small>{{ post.published_at|date:'M d, Y' }}</small>
    </div>

    <h3>{{ post.title }}</h3>

    <p>{{ post.excerpt|truncatewords:18 }}</p>

    <a href="{{ post.get_absolute_url }}" class="blog-read-more">
      Read More
      <i class="fa-solid fa-arrow-right" aria-hidden="true"></i>
    </a>
  </div>
</article>
